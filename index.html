<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MISSION ARENA — اتحدّى. نافس. اثبت نفسك.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08080f; --bg-2:#0e0e1a; --card:rgba(18,18,32,.72); --card-solid:#12121f;
  --border:rgba(140,80,255,.18); --border-hi:rgba(140,80,255,.45);
  --neon:#a855f7; --neon-2:#7c3aed; --cyan:#22d3ee; --gold:#fbbf24;
  --text:#e9e9f0; --muted:#9ca3af; --ok:#10b981; --err:#ef4444;
  --grad-1:linear-gradient(135deg,#a855f7,#22d3ee);
  --grad-2:linear-gradient(135deg,#7c3aed,#a855f7);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Cairo',system-ui,sans-serif;
  background:
    radial-gradient(1200px 600px at 90% -10%, rgba(168,85,247,.12), transparent 60%),
    radial-gradient(900px 500px at -10% 100%, rgba(34,211,238,.10), transparent 60%),
    var(--bg);
  color:var(--text); min-height:100vh; -webkit-font-smoothing:antialiased;
}
a{color:var(--cyan);text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit}

#app{display:flex;min-height:100vh}
.sidebar{
  width:250px;flex-shrink:0;background:linear-gradient(180deg,rgba(20,15,40,.9),rgba(10,10,20,.9));
  border-left:1px solid var(--border);padding:22px 16px;display:flex;flex-direction:column;gap:6px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;padding:0 6px}
.brand-logo{
  width:38px;height:38px;border-radius:10px;background:var(--grad-1);
  display:grid;place-items:center;font-weight:900;font-size:18px;color:#0a0a14;
  box-shadow:0 0 22px rgba(168,85,247,.45)
}
.brand-name{font-weight:900;font-size:15px;letter-spacing:.5px;background:var(--grad-1);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.brand-sub{font-size:10px;color:var(--muted)}

.nav-item{
  display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;
  color:var(--muted);font-weight:600;font-size:14px;transition:.18s;border:1px solid transparent;
  background:transparent;width:100%;text-align:right
}
.nav-item:hover{background:rgba(168,85,247,.08);color:var(--text)}
.nav-item.active{background:rgba(168,85,247,.14);color:var(--text);border-color:var(--border-hi)}
.nav-item .ico{font-size:16px;width:20px;text-align:center}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:14px 26px;border-bottom:1px solid var(--border);background:rgba(8,8,15,.6);backdrop-filter:blur(10px);
  position:sticky;top:0;z-index:20;
}
.topbar h1{font-size:17px;font-weight:800}
.topbar .sub{font-size:12px;color:var(--muted)}
.user-chip{display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:10px;
  background:var(--card);border:1px solid var(--border);font-size:13px}
.user-chip .avatar{font-size:20px}
.user-chip .name{font-weight:700}
.user-chip .rating{color:var(--gold);font-weight:800;font-size:12px}

.content{padding:26px;flex:1}

.card{
  background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;
  backdrop-filter:blur(8px);transition:.2s;
}
.card:hover{border-color:var(--border-hi)}
.card-title{font-size:15px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card-title .ico{font-size:18px}

.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.grid-4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}

.stat{padding:18px;border-radius:14px;background:var(--card);border:1px solid var(--border);position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(168,85,247,.08),transparent);pointer-events:none}
.stat .lbl{font-size:11px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.stat .val{font-size:26px;font-weight:900;background:var(--grad-1);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat.gold .val{background:linear-gradient(135deg,#fbbf24,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 20px;border-radius:10px;font-weight:700;font-size:14px;border:none;
  transition:.18s;white-space:nowrap;
}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--grad-1);color:#0a0a14;box-shadow:0 4px 20px rgba(168,85,247,.35)}
.btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 26px rgba(168,85,247,.5)}
.btn-ghost{background:rgba(168,85,247,.1);color:var(--text);border:1px solid var(--border-hi)}
.btn-ghost:hover:not(:disabled){background:rgba(168,85,247,.2)}
.btn-danger{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.4)}
.btn-gold{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#0a0a14}
.btn-sm{padding:7px 14px;font-size:12px}

.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600}
.field input,.field select,.field textarea{
  width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--border);
  background:rgba(10,10,20,.6);color:var(--text);font-size:14px;outline:none;transition:.18s
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--neon);box-shadow:0 0 0 3px rgba(168,85,247,.15)}
.field textarea{min-height:80px;resize:vertical}

.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:700}
.badge-purple{background:rgba(168,85,247,.15);color:#d8b4fe;border:1px solid rgba(168,85,247,.35)}
.badge-green{background:rgba(16,185,129,.15);color:#6ee7b7;border:1px solid rgba(16,185,129,.35)}
.badge-gold{background:rgba(251,191,36,.15);color:#fcd34d;border:1px solid rgba(251,191,36,.35)}
.badge-red{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.35)}
.badge-gray{background:rgba(156,163,175,.12);color:#d1d5db;border:1px solid rgba(156,163,175,.25)}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:11px 12px;text-align:right;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:700}
tbody tr:hover{background:rgba(168,85,247,.05)}

.alert{padding:12px 16px;border-radius:10px;font-size:13px;margin-bottom:14px;display:none}
.alert.show{display:block}
.alert-error{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);color:#fca5a5}
.alert-success{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.4);color:#6ee7b7}
.alert-info{background:rgba(34,211,238,.12);border:1px solid rgba(34,211,238,.4);color:#a5f3fc}

.muted{color:var(--muted);font-size:13px}
.center-page{min-height:100vh;display:grid;place-items:center;padding:20px}
.auth-card{width:100%;max-width:420px;padding:34px}
.auth-card h2{font-size:24px;font-weight:900;margin-bottom:6px}
.auth-card .sub{color:var(--muted);font-size:13px;margin-bottom:24px}

.loader{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-page{display:grid;place-items:center;padding:60px}
.spinner-lg{width:44px;height:44px;border:3px solid rgba(168,85,247,.2);border-top-color:var(--neon);border-radius:50%;animation:spin .8s linear infinite}

.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,20,.95);
  border-top:1px solid var(--border);padding:8px 6px;z-index:30;backdrop-filter:blur(10px)}
.mobile-nav .row{display:flex;justify-content:space-around}
.mobile-nav button{background:none;border:none;color:var(--muted);padding:6px;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:2px}
.mobile-nav button.active{color:var(--neon)}
.mobile-nav .ico{font-size:18px}

@media(max-width:900px){
  .sidebar{display:none}
  .mobile-nav{display:block}
  .content{padding:16px 14px 90px}
  .topbar{padding:12px 16px}
  .topbar .sub{display:none}
}

.quiz-wrap{max-width:820px;margin:0 auto}
.progress{height:8px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;margin-bottom:20px}
.progress > div{height:100%;background:var(--grad-1);transition:.3s;border-radius:99px}
.option-btn{
  display:block;width:100%;padding:15px 18px;margin-bottom:10px;border-radius:12px;
  background:var(--card);border:1.5px solid var(--border);color:var(--text);text-align:right;
  font-size:15px;font-weight:600;transition:.18s;
}
.option-btn:hover:not(:disabled){border-color:var(--neon);background:rgba(168,85,247,.08)}
.option-btn.selected{border-color:var(--neon);background:rgba(168,85,247,.15);box-shadow:0 0 0 3px rgba(168,85,247,.15)}
.option-btn.correct{border-color:var(--ok);background:rgba(16,185,129,.12)}
.option-btn.wrong{border-color:var(--err);background:rgba(239,68,68,.12)}
.option-btn:disabled{cursor:default}
.timer{font-size:14px;font-weight:800;color:var(--gold);display:flex;align-items:center;gap:6px}

.preview-table{max-height:400px;overflow:auto;border:1px solid var(--border);border-radius:10px}
.preview-table table{font-size:12px}
pre{background:rgba(10,10,20,.8);padding:14px;border-radius:10px;overflow:auto;font-size:12px;border:1px solid var(--border)}

.empty-state{text-align:center;padding:50px 20px;color:var(--muted)}
.empty-state .ico{font-size:48px;margin-bottom:12px;opacity:.5}

.challenge-card{padding:16px;border-radius:12px;background:rgba(168,85,247,.05);border:1px solid var(--border);margin-bottom:10px}
.challenge-card .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;flex-wrap:wrap}
.challenge-card .avatar{font-size:28px}
.code-box{
  font-family:'Courier New',monospace;font-size:28px;letter-spacing:6px;
  text-align:center;padding:18px;border-radius:12px;
  background:linear-gradient(135deg,rgba(168,85,247,.15),rgba(34,211,238,.08));
  border:2px dashed var(--border-hi);color:var(--cyan);font-weight:900;margin:14px 0
}
.versus{display:flex;align-items:center;gap:16px;padding:20px;justify-content:center;flex-wrap:wrap}
.versus .player{text-align:center;min-width:100px}
.versus .player .avatar{font-size:48px;margin-bottom:6px}
.versus .player .name{font-weight:800;font-size:14px}
.versus .vs{font-size:28px;font-weight:900;background:var(--grad-1);-webkit-background-clip:text;background-clip:text;color:transparent}
</style>
</head>
<body>

<div id="app">
  <div class="loading-page" style="grid-column:1/-1"><div class="spinner-lg"></div></div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://laxidxrbocigjfffhkqu.supabase.co';
const SUPABASE_KEY = 'sb_publishable_fllhi_6eqk1E0oMEhHMcoQ_U5s8Ihbo';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
});

const state = {
  user: null,
  profile: null,
  route: '',
  params: {},
  quiz: null,
  duel: null,
  authListeners: [],
};

const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => [...root.querySelectorAll(sel)];

function esc(s){ if(s==null) return ''; return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(n){ return new Intl.NumberFormat('ar-EG').format(n||0); }

function toast(msg, type='info'){
  let t = document.createElement('div');
  const bg = type==='error'?'rgba(239,68,68,.95)': type==='success'?'rgba(16,185,129,.95)':'rgba(168,85,247,.95)';
  t.style.cssText = `position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:12px 22px;border-radius:10px;background:${bg};color:#fff;font-weight:700;font-size:14px;z-index:9999;box-shadow:0 8px 32px rgba(0,0,0,.4);transition:.3s`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; setTimeout(()=>t.remove(),300); }, 3200);
}

async function loadProfile(){
  const { data, error } = await sb.from('profiles').select('*').eq('id', state.user.id).maybeSingle();
  if(error) { console.error(error); return null; }
  state.profile = data;
  return data;
}

function showAlert(elId, msg, type='error'){
  const el = document.getElementById(elId);
  if(!el) return;
  el.className = `alert alert-${type} show`;
  el.textContent = msg;
}

function nav(path){ location.hash = path; }
window.addEventListener('hashchange', route);

function parseHash(){
  const h = location.hash.replace(/^#/, '') || '/';
  const [path, qs] = h.split('?');
  const params = {};
  if(qs) new URLSearchParams(qs).forEach((v,k)=>params[k]=v);
  return { path: path || '/', params };
}

async function route(){
  const { path, params } = parseHash();
  state.route = path;
  state.params = params;

  const publicRoutes = ['/login','/register','/forgot'];
  if(!state.user && !publicRoutes.includes(path)){
    nav('/login'); return;
  }
  if(state.user && publicRoutes.includes(path)){
    nav('/'); return;
  }

  const app = document.getElementById('app');
  if(publicRoutes.includes(path)){
    if(path === '/login') app.innerHTML = renderAuth('login');
    if(path === '/register') app.innerHTML = renderAuth('register');
    if(path === '/forgot') app.innerHTML = renderAuth('forgot');
    bindAuthForm(path);
    return;
  }

  const pageTitle = {
    '/':'لوحة التحكم','/matches':'المباريات','/challenges':'تحديات الأصدقاء',
    '/challenge':'تفاصيل التحدي','/duel':'المباراة','/tournaments':'البطولات',
    '/teams':'الفرق','/leaderboard':'التصنيفات','/profile':'ملفي الشخصي',
    '/notifications':'الإشعارات','/admin':'لوحة الإدارة',
    '/admin/questions':'بنك الأسئلة','/admin/import':'استيراد JSON',
    '/admin/subjects':'المواد','/admin/settings':'الإعدادات'
  }[path] || 'MISSION ARENA';

  app.innerHTML = renderShell(pageTitle);
  bindShell();

  const content = document.getElementById('content');
  content.innerHTML = `<div class="loading-page"><div class="spinner-lg"></div></div>`;

  try{
    if(path === '/') await viewDashboard(content);
    else if(path === '/challenges') await viewChallenges(content);
    else if(path === '/challenge') await viewChallengeDetail(content, params.code);
    else if(path === '/duel') await viewDuel(content, params.id);
    else if(path === '/matches') await viewMatches(content);
    else if(path === '/tournaments') await viewTournaments(content);
    else if(path === '/teams') await viewTeams(content);
    else if(path === '/leaderboard') await viewLeaderboard(content);
    else if(path === '/profile') await viewProfile(content);
    else if(path === '/notifications') await viewNotifications(content);
    else if(path === '/admin') await viewAdmin(content);
    else if(path === '/admin/questions') await viewAdminQuestions(content);
    else if(path === '/admin/import') await viewAdminImport(content);
    else if(path === '/admin/subjects') await viewAdminSubjects(content);
    else if(path === '/admin/settings') await viewAdminSettings(content);
    else content.innerHTML = `<div class="empty-state"><div class="ico">🔍</div><p>الصفحة غير موجودة</p></div>`;
  }catch(err){
    console.error(err);
    content.innerHTML = `<div class="alert alert-error show">حدث خطأ: ${esc(err.message||err)}</div>`;
  }
}

function renderAuth(mode){
  const titles = { login:'تسجيل الدخول', register:'إنشاء حساب', forgot:'استعادة كلمة المرور' };
  const subs = {
    login:'أدخل بياناتك للمتابعة إلى الحلبة',
    register:'انضم إلى MISSION ARENA وابدأ رحلتك',
    forgot:'سنرسل لك رابط إعادة التعيين عبر البريد'
  };
  let fields = '';
  if(mode==='login'){
    fields = `
      <div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" required dir="ltr" placeholder="you@example.com"></div>
      <div class="field"><label>كلمة المرور</label><input id="password" type="password" required dir="ltr" placeholder="••••••••"></div>
      <div id="alert" class="alert alert-error"></div>
      <button id="submit" class="btn btn-primary" style="width:100%;margin-bottom:14px">دخول</button>
      <div class="muted" style="text-align:center;font-size:13px">
        <a href="#/forgot">نسيت كلمة المرور؟</a> · 
        <a href="#/register">إنشاء حساب جديد</a>
      </div>`;
  } else if(mode==='register'){
    fields = `
      <div class="field"><label>الاسم المستعار</label><input id="username" required minlength="3" maxlength="20" placeholder="مثال: نجم الحلبة"></div>
      <div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" required dir="ltr" placeholder="you@example.com"></div>
      <div class="field"><label>كلمة المرور</label><input id="password" type="password" required minlength="6" dir="ltr" placeholder="6 أحرف على الأقل"></div>
      <div id="alert" class="alert alert-error"></div>
      <button id="submit" class="btn btn-primary" style="width:100%;margin-bottom:14px">إنشاء الحساب</button>
      <div class="muted" style="text-align:center;font-size:13px">
        لديك حساب؟ <a href="#/login">تسجيل الدخول</a>
      </div>`;
  } else {
    fields = `
      <div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" required dir="ltr" placeholder="you@example.com"></div>
      <div id="alert" class="alert alert-error"></div>
      <button id="submit" class="btn btn-primary" style="width:100%;margin-bottom:14px">إرسال رابط الاستعادة</button>
      <div class="muted" style="text-align:center;font-size:13px">
        <a href="#/login">عودة لتسجيل الدخول</a>
      </div>`;
  }
  return `
    <div class="center-page" style="display:grid">
      <div class="card auth-card">
        <div style="text-align:center;margin-bottom:22px">
          <div class="brand-logo" style="margin:0 auto 12px;width:52px;height:52px;font-size:24px">MA</div>
          <div class="brand-name" style="font-size:20px">MISSION ARENA</div>
          <div class="brand-sub">اتحدّى. نافس. اثبت نفسك.</div>
        </div>
        <h2>${titles[mode]}</h2>
        <p class="sub">${subs[mode]}</p>
        ${fields}
      </div>
    </div>`;
}

function bindAuthForm(mode){
  const btn = document.getElementById('submit');
  if(!btn) return;
  btn.addEventListener('click', async () => {
    btn.disabled = true; btn.innerHTML = '<span class="loader"></span>';
    const email = document.getElementById('email').value.trim();
    try{
      if(mode==='login'){
        const password = document.getElementById('password').value;
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if(error) throw error;
        toast('تم تسجيل الدخول ✓','success');
      } else if(mode==='register'){
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        if(!username || username.length<3) throw new Error('الاسم المستعار يجب أن يكون 3 أحرف على الأقل');
        const { error } = await sb.auth.signUp({
          email, password,
          options: { data: { username } }
        });
        if(error) throw error;
        toast('تم إنشاء الحساب ✓ تحقق من بريدك','success');
      } else {
        const { error } = await sb.auth.resetPasswordForEmail(email);
        if(error) throw error;
        toast('تم إرسال رابط الاستعادة','success');
      }
    }catch(err){
      showAlert('alert', err.message || 'حدث خطأ');
    }finally{
      btn.disabled = false;
      btn.textContent = mode==='login'?'دخول':mode==='register'?'إنشاء الحساب':'إرسال رابط الاستعادة';
    }
  });
}

function renderShell(title){
  const p = state.profile || {};
  const isAdmin = p.role === 'admin';
  const navItems = [
    { path:'/', ico:'🏠', label:'الرئيسية' },
    { path:'/matches', ico:'⚔️', label:'المباريات' },
    { path:'/challenges', ico:'🎯', label:'التحديات' },
    { path:'/tournaments', ico:'🏆', label:'البطولات' },
    { path:'/teams', ico:'🛡️', label:'الفرق' },
    { path:'/leaderboard', ico:'📊', label:'التصنيفات' },

function bindShell(){
  $$('[data-nav]').forEach(b => b.addEventListener('click', ()=>nav(b.dataset.nav)));

}

async function viewChallenges(root){
  const uid = state.user.id;
  const [{data: subjects}, {data: incoming}, {data: outgoing}, {data: duels}]
    = await Promise.all([
      sb.from('subjects').select('id,name').eq('is_active',true).order('name'),
      sb.from('challenges').select('*').eq('opponent_id', uid).eq('status','pending'),
      sb.from('challenges').select('*').eq('challenger_id', uid).eq('status','pending'),
      sb.from('duels').select('*').or(`player_a.eq.${uid},player_b.eq.${uid}`)
        .eq('status','active')
    ]);

  const allIds = new Set();
  (incoming||[]).forEach(c => allIds.add(c.challenger_id));
  (outgoing||[]).forEach(c => allIds.add(c.opponent_id));
  (duels||[]).forEach(d => { allIds.add(d.player_a); allIds.add(d.player_b); });
  allIds.delete(uid);
  const {data: profiles} = await sb.from('profiles').select('id,username,avatar,rating')
    .in('id', [...allIds].filter(Boolean));
  const pmap = Object.fromEntries((profiles||[]).map(p=>[p.id,p]));

  root.innerHTML = `
    <div class="grid grid-2">
      <div class="card">
        <div class="card-title"><span class="ico">🎯</span> إنشاء تحدٍ جديد</div>
        <div class="field">
          <label>نوع التحدي</label>
          <select id="ch-mode">
            <option value="open">رابط مفتوح (أي شخص)</option>
            <option value="direct">لاعب محدد</option>
          </select>
        </div>
        <div class="field" id="opp-field" style="display:none">
          <label>الخصم</label>
          <select id="ch-opponent"><option value="">— اختيار —</option></select>
        </div>
        <div class="field">
          <label>المادة</label>
          <select id="ch-subject">${(subjects||[]).map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select>
        </div>
        <div class="field">
          <label>الصعوبة</label>
          <select id="ch-diff">
            <option value="easy">سهل</option><option value="medium" selected>متوسط</option>
            <option value="hard">صعب</option>
          </select>
        </div>
        <div class="field">
          <label>عدد الأسئلة</label>
          <select id="ch-count">
            <option value="5" selected>5</option><option value="10">10</option>
          </select>
        </div>
        <div id="ch-alert" class="alert alert-error"></div>
        <button class="btn btn-primary" id="ch-create" style="width:100%">🎯 إنشاء التحدي</button>
      </div>

      <div>
        <div class="card" style="margin-bottom:16px">
          <div class="card-title"><span class="ico">📥</span> تحديات واردة (${(incoming||[]).length})</div>
          ${incoming&&incoming.length ? incoming.map(c=>{
            const p = pmap[c.challenger_id]||{username:'?',avatar:'?'};
            return `<div class="challenge-card">
              <div class="head">
                <div style="display:flex;align-items:center;gap:10px">
                  <span class="avatar">${esc(p.avatar)}</span>
                  <div><div style="font-weight:800">${esc(p.username)}</div>
                  <div class="muted" style="font-size:11px">⭐ ${p.rating}</div></div>
                </div>
                <span class="badge badge-gold">${c.difficulty} · ${c.question_count} سؤال</span>
              </div>
              <div style="display:flex;gap:8px">
                <button class="btn btn-primary btn-sm" data-accept="${esc(c.code)}" style="flex:1">قبول</button>
                <button class="btn btn-danger btn-sm" data-reject="${esc(c.code)}" style="flex:1">رفض</button>
              </div>
            </div>`;
          }).join('') : '<div class="empty-state"><div class="ico">📭</div><p>لا تحديات واردة</p></div>'}
        </div>

        <div class="card" style="margin-bottom:16px">
          <div class="card-title"><span class="ico">📤</span> تحدياتي المُرسَلة (${(outgoing||[]).length})</div>
          ${outgoing&&outgoing.length ? outgoing.map(c=>`
            <div class="challenge-card">
              <div class="head">
                <div><strong>${c.difficulty} · ${c.question_count} أسئلة</strong></div>
                <span class="badge badge-purple">${esc(c.code)}</span>
              </div>
              <div class="muted" style="font-size:11px;margin-bottom:8px">
                تنتهي: ${new Date(c.expires_at).toLocaleString('ar-EG')}
              </div>
              <button class="btn btn-ghost btn-sm" data-copy="${esc(c.code)}" style="width:100%">📋 نسخ رابط التحدي</button>
            </div>`).join('') : '<div class="empty-state"><div class="ico">📭</div><p>لم ترسل تحديات</p></div>'}
        </div>

        <div class="card">
          <div class="card-title"><span class="ico">⚔️</span> مباريات جارية (${(duels||[]).length})</div>
          ${duels&&duels.length ? duels.map(d=>{
            const isA = d.player_a === uid;
            const oppId = isA ? d.player_b : d.player_a;
            const opp = pmap[oppId]||{username:'?'};
            const iFinished = isA ? d.a_finished_at : d.b_finished_at;
            return `<div class="challenge-card">
              <div class="head">
                <div>مع <strong>${esc(opp.username)}</strong></div>
                <span class="badge ${iFinished?'badge-gold':'badge-green'}">
                  ${iFinished?'بانتظار الخصم':'ابدأ الآن'}
                </span>
              </div>
              <button class="btn btn-primary btn-sm" data-duel="${d.id}" style="width:100%">
                ${iFinished?'عرض الحالة':'▶️ دخول المباراة'}
              </button>
            </div>`;
          }).join('') : '<div class="empty-state"><div class="ico">⚔️</div><p>لا مباريات جارية</p></div>'}
        </div>
      </div>
    </div>`;

  const {data: players} = await sb.from('profiles')
    .select('id,username,avatar,rating').neq('id', uid)
    .order('rating',{ascending:false}).limit(100);
  const sel = document.getElementById('ch-opponent');
  (players||[]).forEach(p=>{
    const opt = document.createElement('option');
    opt.value = p.id;
    opt.textContent = `${p.avatar} ${p.username} (${p.rating})`;
    sel.appendChild(opt);
  });

  document.getElementById('ch-mode').addEventListener('change', (e)=>{
    document.getElementById('opp-field').style.display = e.target.value==='direct'?'block':'none';
  });

  document.getElementById('ch-create').addEventListener('click', async (ev)=>{
    const btn = ev.currentTarget;
    btn.disabled = true; btn.innerHTML = '<span class="loader"></span>';
    try{
      const mode = document.getElementById('ch-mode').value;
      const oppId = mode==='direct' ? document.getElementById('ch-opponent').value : null;
      if(mode==='direct' && !oppId) throw new Error('اختر خصماً');
      const {data, error} = await sb.rpc('create_challenge', {
        p_opponent_id: oppId,
        p_subject_id: document.getElementById('ch-subject').value,
        p_difficulty: document.getElementById('ch-diff').value,
        p_count: parseInt(document.getElementById('ch-count').value)
      });
      if(error) throw error;

      const link = location.origin + location.pathname + '#/challenge?code=' + data.code;
      root.querySelector('#ch-alert').className = 'alert alert-success show';
      root.querySelector('#ch-alert').innerHTML =
        `✅ تم إنشاء التحدي! الكود: <strong>${data.code}</strong><br>
         <button class="btn btn-sm btn-ghost" style="margin-top:8px" id="copy-link">📋 نسخ الرابط</button>`;
      document.getElementById('copy-link').addEventListener('click', ()=>{
        navigator.clipboard.writeText(link).then(()=>toast('تم نسخ الرابط ✓','success'));
      });
      toast('تم إنشاء التحدي ✓','success');
    }catch(err){
      root.querySelector('#ch-alert').className = 'alert alert-error show';
      root.querySelector('#ch-alert').textContent = err.message || err;
    }finally{
      btn.disabled = false; btn.textContent = '🎯 إنشاء التحدي';
    }
  });

  $$('[data-accept]').forEach(b=>b.addEventListener('click', async ()=>{
    b.disabled = true; b.innerHTML = '<span class="loader"></span>';
    try{
      const {data, error} = await sb.rpc('accept_challenge', { p_code: b.dataset.accept });
      if(error) throw error;
      toast('تم قبول التحدي ✓','success');
      nav('/duel?id='+data);
    }catch(err){
      toast(err.message||'فشل القبول','error');
      b.disabled = false; b.textContent = 'قبول';
    }
  }));
  $$('[data-reject]').forEach(b=>b.addEventListener('click', async ()=>{
    try{
      const {error} = await sb.rpc('reject_challenge', { p_code: b.dataset.reject });
      if(error) throw error;
      toast('تم الرفض','success'); route();
    }catch(err){ toast(err.message||'فشل','error'); }
  }));
  $$('[data-copy]').forEach(b=>b.addEventListener('click', ()=>{
    const link = location.origin + location.pathname + '#/challenge?code=' + b.dataset.copy;
    navigator.clipboard.writeText(link).then(()=>toast('تم النسخ ✓','success'));
  }));
  $$('[data-duel]').forEach(b=>b.addEventListener('click', ()=>nav('/duel?id='+b.dataset.duel)));
}

async function viewChallengeDetail(root, code){
  if(!code){ root.innerHTML = `<div class="alert alert-error show">كود مفقود</div>`; return; }

  const {data: ch, error} = await sb.from('challenges').select('*').eq('code', code.toUpperCase()).maybeSingle();
  if(error || !ch){
    root.innerHTML = `<div class="card"><div class="empty-state"><div class="ico">🔍</div>
      <p>التحدي غير موجود أو منتهي.</p></div></div>`;
    return;
  }

  const {data: challenger} = await sb.from('profiles').select('username,avatar,rating')
    .eq('id', ch.challenger_id).maybeSingle();
  const {data: subject} = await sb.from('subjects').select('name').eq('id', ch.subject_id).maybeSingle();
  const uid = state.user.id;
  const isOwn = ch.challenger_id === uid;
  const isAccepted = ch.status === 'accepted';

  let actionHtml = '';
  if(isOwn){
    actionHtml = `<div class="alert alert-info show">هذا تحديك أنت. لا يمكنك قبوله — شارك الرابط مع صديق.</div>
      <button class="btn btn-ghost" onclick="location.hash='/challenges'" style="width:100%">العودة للتحديات</button>`;
  } else if(ch.status === 'pending'){
    actionHtml = `<div style="display:flex;gap:8px">
      <button class="btn btn-primary" id="acc" style="flex:1">✅ قبول التحدي</button>
      <button class="btn btn-danger" id="rej" style="flex:1">❌ رفض</button>
    </div>`;
  } else if(isAccepted){
    const {data: duel} = await sb.from('duels').select('id').eq('challenge_id', ch.id).maybeSingle();
    actionHtml = `<div class="alert alert-success show">التحدي مقبول. جاهز؟</div>
      <button class="btn btn-primary" onclick="location.hash='/duel?id=${duel?.id}'" style="width:100%">▶️ دخول المباراة</button>`;
  } else {
    actionHtml = `<div class="alert alert-error show">حالة التحدي: ${ch.status}</div>`;
  }

  root.innerHTML = `
    <div class="card" style="max-width:600px;margin:0 auto">
      <div style="text-align:center;margin-bottom:20px">
        <div style="font-size:56px;margin-bottom:8px">🎯</div>
        <div style="font-size:20px;font-weight:900">تحدي من ${esc(challenger?.username||'?')}</div>
        <div class="muted">⭐ ${challenger?.rating||0}</div>
      </div>
      <div class="versus">
        <div class="player">
          <div class="avatar">${esc(challenger?.avatar||'?')}</div>
          <div class="name">${esc(challenger?.username||'?')}</div>
        </div>
        <div class="vs">VS</div>
        <div class="player">
          <div class="avatar">${esc(state.profile?.avatar||'🦊')}</div>
          <div class="name">${esc(state.profile?.username||'?')}</div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0">
        <div class="stat"><div class="lbl">المادة</div><div class="val" style="font-size:16px">${esc(subject?.name||'—')}</div></div>
        <div class="stat"><div class="lbl">الصعوبة</div><div class="val" style="font-size:16px">${ch.difficulty}</div></div>
        <div class="stat"><div class="lbl">الأسئلة</div><div class="val" style="font-size:16px">${ch.question_count}</div></div>
        <div class="stat"><div class="lbl">تنتهي</div><div class="val" style="font-size:14px">${new Date(ch.expires_at).toLocaleDateString('ar-EG')}</div></div>
      </div>
      ${actionHtml}
    </div>`;

  if(ch.status === 'pending' && !isOwn){
    document.getElementById('acc')?.addEventListener('click', async (ev)=>{
      const b = ev.currentTarget; b.disabled = true; b.innerHTML='<span class="loader"></span>';
      try{
        const {data, error} = await sb.rpc('accept_challenge', { p_code: code.toUpperCase() });
        if(error) throw error;
        toast('تم قبول التحدي ✓','success');
        nav('/duel?id='+data);
      }catch(err){ toast(err.message||'فشل','error'); b.disabled=false; b.textContent='✅ قبول التحدي'; }
    });
    document.getElementById('rej')?.addEventListener('click', async ()=>{
      try{
        const {error} = await sb.rpc('reject_challenge', { p_code: code.toUpperCase() });
        if(error) throw error;
        toast('تم الرفض','success');
        nav('/challenges');
      }catch(err){ toast(err.message||'فشل','error'); }
    });
  }
}

async function viewDuel(root, duelId){
  if(!duelId){ root.innerHTML = `<div class="alert alert-error show">معرّف مفقود</div>`; return; }

  const {data: duel, error} = await sb.from('duels').select('*').eq('id', duelId).maybeSingle();
  if(error || !duel){ root.innerHTML = `<div class="alert alert-error show">المباراة غير موجودة</div>`; return; }

  const uid = state.user.id;
  const isA = duel.player_a === uid;
  const oppId = isA ? duel.player_b : duel.player_a;
  const myFinished = isA ? !!duel.a_finished_at : !!duel.b_finished_at;
  const bothDone = !!duel.a_finished_at && !!duel.b_finished_at;
  const {data: opp} = await sb.from('profiles').select('username,avatar,rating').eq('id', oppId).maybeSingle();

  if(bothDone){
    const winner = duel.winner_id;
    const iWon = winner === uid;
    const tie = winner === null;
    const myScore = isA ? duel.a_correct : duel.b_correct;
    const oppScore = isA ? duel.b_correct : duel.a_correct;
    root.innerHTML = `
      <div class="quiz-wrap" style="max-width:640px">
        <div class="card" style="text-align:center;padding:40px 20px">
          <div style="font-size:72px;margin-bottom:12px">${tie?'🤝':iWon?'🏆':'💪'}</div>
          <div style="font-size:26px;font-weight:900;margin-bottom:20px;background:var(--grad-1);-webkit-background-clip:text;background-clip:text;color:transparent">
            ${tie?'تعادل':iWon?'فوز رائع!':'محاولة جيدة'}
          </div>
          <div class="versus" style="margin-bottom:20px">
            <div class="player">
              <div class="avatar">${esc(state.profile.avatar)}</div>
              <div class="name">${esc(state.profile.username)}</div>
              <div style="font-size:24px;font-weight:900;color:${myScore>=oppScore?'var(--ok)':'var(--err)'}">${myScore}/${duel.question_count}</div>
            </div>
            <div class="vs">VS</div>
            <div class="player">
              <div class="avatar">${esc(opp?.avatar||'?')}</div>
              <div class="name">${esc(opp?.username||'?')}</div>
              <div style="font-size:24px;font-weight:900;color:${oppScore>myScore?'var(--ok)':'var(--err)'}">${oppScore}/${duel.question_count}</div>
            </div>
          </div>
          <button class="btn btn-primary" onclick="location.hash='/challenges'" style="width:100%">🔄 تحدٍ جديد</button>
        </div>
      </div>`;
    return;
  }

  if(myFinished){
    root.innerHTML = `
      <div class="quiz-wrap" style="max-width:600px">
        <div class="card" style="text-align:center;padding:40px 20px">
          <div style="font-size:56px;margin-bottom:12px">⏳</div>
          <div style="font-size:20px;font-weight:900;margin-bottom:8px">بانتظار ${esc(opp?.username||'الخصم')}...</div>
          <div class="muted" style="margin-bottom:20px">أكملت دورك. سنعرض النتيجة تلقائياً عند انتهاء الخصم.</div>
          <div class="spinner-lg" style="margin:0 auto"></div>
        </div>
      </div>`;
    const poll = setInterval(async ()=>{
      const {data: fresh} = await sb.from('duels').select('*').eq('id', duelId).maybeSingle();
      if(fresh && fresh.a_finished_at && fresh.b_finished_at){
        clearInterval(poll);
        viewDuel(root, duelId);
      }
    }, 3000);
    state._duelPoll = poll;
    return;
  }

  state.duel = state.duel && state.duel.id === duelId ? state.duel : null;
  if(!state.duel){
    const {data: qs, error: qerr} = await sb.rpc('duel_get_questions', { p_duel_id: duelId });
    if(qerr){ root.innerHTML = `<div class="alert alert-error show">${esc(qerr.message)}</div>`; return; }
    state.duel = {
      id: duelId, questions: qs || [], current: 0,
      startedAt: Date.now(), questionStart: Date.now()
    };
  }
  renderDuel(root, opp);
}

function renderDuel(root, opp){
  const d = state.duel;
  if(!d) return;
  if(d.current >= d.questions.length) return finishDuel(root);

  const cur = d.questions[d.current];
  const snap = cur.snapshot;
  const pct = Math.round((d.current / d.questions.length) * 100);

  root.innerHTML = `
    <div class="quiz-wrap">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div class="muted">ضد ${esc(opp?.username||'?')} · السؤال ${d.current+1}/${d.questions.length}</div>
        <div class="timer" id="timer">⏱️ 00:00</div>
      </div>
      <div class="progress"><div style="width:${pct}%"></div></div>
      <div class="card">
        <div style="font-size:11px;color:var(--muted);margin-bottom:6px">${esc(snap.topic||'')}</div>
        <div style="font-size:18px;font-weight:800;margin-bottom:18px;line-height:1.5">${esc(snap.question)}</div>
        <div id="options">
          ${Object.entries(snap.options||{}).map(([k,v])=>`
            <button class="option-btn" data-opt="${k}">${esc(k)}) ${esc(v)}</button>
          `).join('')}
        </div>
      </div>
    </div>`;

  const tStart = Date.now();
  const timer = setInterval(()=>{
    const s = Math.floor((Date.now()-tStart)/1000);
    const el = document.getElementById('timer');
    if(el) el.textContent = `⏱️ ${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  }, 500);

  $$('#options .option-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      clearInterval(timer);
      const ans = btn.dataset.opt;
      const timeMs = Date.now() - d.questionStart;
      btn.classList.add('selected');
      $$('#options .option-btn').forEach(b=>b.disabled=true);
      try{
        await sb.rpc('duel_submit_answer', {
          p_duel_id: d.id, p_question_id: cur.qid, p_answer: ans, p_time_ms: timeMs
        });
      }catch(e){ console.warn(e); }
      d.current++; d.questionStart = Date.now();
      setTimeout(()=>renderDuel(root, opp), 300);
    });
  });
}

async function finishDuel(root){
  const d = state.duel;
  root.innerHTML = `<div class="loading-page"><div class="spinner-lg"></div><p class="muted" style="margin-top:12px">جاري حساب النتيجة...</p></div>`;
  try{
    const {data, error} = await sb.rpc('duel_finish', { p_duel_id: d.id });
    if(error) throw error;
    await loadProfile();
    const duelId = d.id;
    state.duel = null;
    if(data.waiting_opponent){
      toast('انتهى دورك! بانتظار الخصم...','info');
    } else {
      toast('انتهت المباراة!','success');
    }
    viewDuel(root, duelId);
  }catch(err){
    state.duel = null;
    root.innerHTML = `<div class="alert alert-error show">${esc(err.message||err)}</div>
      <button class="btn btn-primary" onclick="location.hash='/challenges'">عودة</button>`;
  }
}

async function viewMatches(root){
  if(state.quiz){
    return renderQuiz(root);
  }

  const { data: subjects } = await sb.from('subjects').select('id, name').eq('is_active',true).order('name');
  const { data: history } = await sb.from('matches')
    .select('id, score, correct_answers, question_count, status, finished_at, difficulty, subject_id')
    .eq('player_id', state.user.id)
    .order('started_at',{ascending:false}).limit(20);

  root.innerHTML = `
    <div class="grid grid-2">
      <div class="card">
        <div class="card-title"><span class="ico">⚔️</span> ابدأ مباراة جديدة</div>
        <div class="field">
          <label>المادة</label>
          <select id="subject">${(subjects||[]).map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')||'<option value="">— لا توجد مواد —</option>'}</select>
        </div>
        <div class="field">
          <label>مستوى الصعوبة</label>
          <select id="difficulty">
            <option value="easy">سهل</option>
            <option value="medium" selected>متوسط</option>
            <option value="hard">صعب</option>
          </select>
        </div>
        <div class="field">
          <label>عدد الأسئلة</label>
          <select id="count">
            <option value="5" selected>5</option>
            <option value="10">10</option>
            <option value="15">15</option>
          </select>
        </div>
        <div id="match-alert" class="alert alert-error"></div>
        <button class="btn btn-primary" id="btn-create" style="width:100%">🚀 ابدأ الآن</button>
      </div>

      <div class="card">
        <div class="card-title"><span class="ico">📜</span> سجل المباريات</div>
        ${history&&history.length ? `
          <table><thead><tr><th>النتيجة</th><th>الإجابات</th><th>الحالة</th><th>التاريخ</th></tr></thead><tbody>
          ${history.map(m=>`<tr>
            <td>${m.status==='finished'?`<span class="badge ${m.score>=70?'badge-green':'badge-red'}">${m.score}%</span>`:'—'}</td>
            <td>${m.correct_answers||0}/${m.question_count}</td>
            <td>${m.status==='finished'?'<span class="badge badge-green">منتهية</span>':'<span class="badge badge-gold">جارية</span>'}</td>
            <td class="muted">${new Date(m.finished_at||Date.now()).toLocaleDateString('ar-EG')}</td>
          </tr>`).join('')}
          </tbody></table>` : `<div class="empty-state"><div class="ico">⚔️</div><p>لم تلعب أي مباراة بعد</p></div>`}
      </div>
    </div>`;

  document.getElementById('btn-create').addEventListener('click', async (ev)=>{
    const btn = ev.currentTarget;
    const subject = document.getElementById('subject').value;
    const difficulty = document.getElementById('difficulty').value;
    const count = parseInt(document.getElementById('count').value);
    if(!subject){ return showAlert('match-alert','اختر مادة أولاً','error'); }
    btn.disabled = true; btn.innerHTML = '<span class="loader"></span> جاري التحضير...';
    try{
      const { data, error } = await sb.rpc('start_match', {
        p_subject_id: subject, p_difficulty: difficulty, p_count: count
      });
      if(error) throw error;
      const { data: qs, error: qerr } = await sb.rpc('get_match_questions', { p_match_id: data });
      if(qerr) throw qerr;
      state.quiz = {
        matchId: data,
        questions: qs || [],
        current: 0,
        answers: {},
        startedAt: Date.now(),
        questionStart: Date.now(),
      };
      renderQuiz(root);
    }catch(err){
      btn.disabled = false; btn.textContent = '🚀 ابدأ الآن';
      showAlert('match-alert', 'تعذر بدء المباراة: '+ (err.message||err), 'error');
    }
  });
}

function renderQuiz(root){
  const q = state.quiz;
  if(!q) return;
  if(q.current >= q.questions.length){
    return finishQuiz(root);
  }
  const cur = q.questions[q.current];
  const snap = cur.snapshot;
  const pct = Math.round((q.current / q.questions.length) * 100);

  root.innerHTML = `
    <div class="quiz-wrap">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div class="muted">السؤال ${q.current+1} من ${q.questions.length}</div>
        <div class="timer" id="timer">⏱️ 00:00</div>
      </div>
      <div class="progress"><div style="width:${pct}%"></div></div>

      <div class="card">
        <div style="font-size:11px;color:var(--muted);margin-bottom:6px">${esc(snap.topic||'')} · ${esc(snap.difficulty||'')}</div>
        <div style="font-size:18px;font-weight:800;margin-bottom:18px;line-height:1.5">${esc(snap.question)}</div>
        <div id="options">
          ${Object.entries(snap.options||{}).map(([k,v])=>`
            <button class="option-btn" data-opt="${k}">${esc(k)}) ${esc(v)}</button>
          `).join('')}
        </div>
      </div>
    </div>`;

  const tStart = Date.now();
  const timer = setInterval(()=>{
    const s = Math.floor((Date.now()-tStart)/1000);
    const el = document.getElementById('timer');
    if(el) el.textContent = `⏱️ ${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  }, 500);
  q._timer = timer;

  $$('#options .option-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      clearInterval(q._timer);
      const ans = btn.dataset.opt;
      const timeMs = Date.now() - q.questionStart;
      btn.classList.add('selected');
      $$('#options .option-btn').forEach(b=>b.disabled=true);

      try{
        const { error } = await sb.rpc('submit_answer', {
          p_match_id: q.matchId,
          p_question_id: cur.qid,
          p_answer: ans,
          p_time_ms: timeMs
        });
        if(error) console.warn(error);
      }catch(e){ console.warn(e); }

      q.answers[cur.qid] = ans;
      q.current++;
      q.questionStart = Date.now();
      setTimeout(()=>renderQuiz(root), 350);
    });
  });
}

async function finishQuiz(root){
  const q = state.quiz;
  root.innerHTML = `<div class="loading-page"><div class="spinner-lg"></div><p class="muted" style="margin-top:12px">جاري حساب النتيجة...</p></div>`;
  try{
    const { data, error } = await sb.rpc('finish_match', { p_match_id: q.matchId });
    if(error) throw error;
    state.quiz = null;
    await loadProfile();

    const win = data.score >= 70;
    root.innerHTML = `
      <div class="quiz-wrap">
        <div class="card" style="text-align:center;padding:40px 20px">
          <div style="font-size:72px;margin-bottom:12px">${win?'🏆':'💪'}</div>
          <div style="font-size:26px;font-weight:900;margin-bottom:6px;background:var(--grad-1);-webkit-background-clip:text;background-clip:text;color:transparent">
            ${win?'فوز رائع!':'محاولة جيدة'}
          </div>
          <div class="muted" style="margin-bottom:26px">النتيجة: ${data.correct} من ${data.total}</div>

          <div class="grid grid-3" style="margin-bottom:22px">
            <div class="stat"><div class="lbl">النقاط</div><div class="val">${data.score}%</div></div>
            <div class="stat"><div class="lbl">XP مكتسبة</div><div class="val" style="color:#34d399">+${data.xp_gained}</div></div>
            <div class="stat gold"><div class="lbl">التصنيف</div><div class="val">${data.rating_delta>=0?'+':''}${data.rating_delta}</div></div>
          </div>

          <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
            <button class="btn btn-primary" onclick="location.hash='/matches';location.reload()">🔄 مباراة جديدة</button>
            <button class="btn btn-ghost" onclick="location.hash='/'">🏠 الرئيسية</button>
          </div>
        </div>
      </div>`;
  }catch(err){
    state.quiz = null;
    root.innerHTML = `<div class="alert alert-error show">خطأ: ${esc(err.message||err)}</div>
      <button class="btn btn-primary" onclick="location.hash='/matches';location.reload()">عودة</button>`;
  }
}

          <div class="card-title"><span class="ico">📈</span> الإحصائيات</div>
          <div class="grid grid-2">
            <div class="stat"><div class="lbl">المستوى</div><div class="val">Lv ${p.level}</div></div>

        </div>
      </div>
    </div>`;

  let selectedAvatar = p.avatar;
  $$('.avatar-pick').forEach(b=>b.addEventListener('click', ()=>{
    selectedAvatar = b.dataset.a;
    $$('.avatar-pick').forEach(x=>x.style.borderColor='transparent');
    b.style.borderColor = 'var(--neon)';
  }));

  document.getElementById('save-profile').addEventListener('click', async (ev)=>{
    const btn = ev.currentTarget;

    try{

      const bio = document.getElementById('f-bio').value.trim();

    }finally{
      btn.disabled = false; btn.textContent = '💾 حفظ التغييرات';

  });
}

async function viewAdminImport(root){
  if(state.profile.role !== 'admin'){ root.innerHTML = `<div class="alert alert-error show">ليس لديك صلاحية</div>`; return; }

  root.innerHTML = `
    <div class="card">
      <div class="card-title"><span class="ico">📥</span> استيراد أسئلة من JSON</div>
      <div class="alert alert-info show" style="margin-bottom:16px">
        الصيغة المتوقعة: مصفوفة من الكائنات، كل كائن يحتوي على subject, topic, difficulty, question, options (A,B,C,D), correct, explanation.
      </div>
      <div class="field">
        <label>ملف JSON</label>
        <input type="file" id="file" accept=".json,application/json">
      </div>
      <div class="field">
        <label>حالة الأسئلة بعد الاستيراد</label>
        <select id="import-status">
          <option value="draft" selected>مسودة (مراجعة)</option>
          <option value="published">منشورة مباشرة</option>
        </select>
      </div>
      <div id="import-alert" class="alert alert-error"></div>

      <div id="preview-area" style="display:none;margin-top:20px">
        <div class="card-title">🔍 المعاينة</div>
        <div id="preview-summary" style="margin-bottom:10px"></div>
        <div class="preview-table" id="preview-table"></div>
        <div style="display:flex;gap:8px;margin-top:14px">
          <button class="btn btn-primary" id="btn-confirm">✓ تأكيد الاستيراد</button>
          <button class="btn btn-ghost" id="btn-cancel">إلغاء</button>
        </div>
      </div>

      <div id="result-area" style="display:none;margin-top:16px"></div>
    </div>`;

  let validItems = [];

  document.getElementById('file').addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const resultEl = document.getElementById('result-area');
    resultEl.style.display='none';

    if(!file.name.toLowerCase().endsWith('.json')){ return showAlert('import-alert','ملف يجب أن يكون .json','error'); }
    if(file.size > 5*1024*1024){ return showAlert('import-alert','الحد الأقصى 5MB','error'); }

    try{
      const text = await file.text();
      const raw = JSON.parse(text);
      if(!Array.isArray(raw)) throw new Error('الملف يجب أن يحتوي على مصفوفة');

      const errors = [];
      validItems = [];
      raw.forEach((item, i)=>{
        const idx = i+1;
        if(!item || typeof item !== 'object'){ errors.push({idx, reason:'ليس كائن'}); return; }
        if(!item.question || !String(item.question).trim()){ errors.push({idx, reason:'نص السؤال فارغ'}); return; }
        if(!item.subject){ errors.push({idx, reason:'المادة مفقودة'}); return; }
        if(!item.options || typeof item.options !== 'object'){ errors.push({idx, reason:'الخيارات مفقودة'}); return; }
        const keys = ['A','B','C','D'];
        for(const k of keys){
          if(!item.options[k] || !String(item.options[k]).trim()){
            errors.push({idx, reason:`الخيار ${k} فارغ`}); return;
          }
        }
        if(!item.correct || !keys.includes(item.correct)){
          errors.push({idx, reason:'الإجابة الصحيحة غير صالحة'}); return;
        }
        validItems.push({
          id: item.id || null,
          subject: String(item.subject).trim(),
          topic: item.topic ? String(item.topic).trim() : 'عام',
          difficulty: ['easy','medium','hard'].includes(item.difficulty)?item.difficulty:'medium',
          question: String(item.question).trim(),
          options: {
            A: String(item.options.A).trim(),
            B: String(item.options.B).trim(),
            C: String(item.options.C).trim(),
            D: String(item.options.D).trim(),
          },
          correct: item.correct,
          explanation: item.explanation ? String(item.explanation).trim() : ''
        });
      });

      const s = document.getElementById('preview-summary');
      s.innerHTML = `
        <div class="grid grid-3">
          <div class="stat"><div class="lbl">إجمالي</div><div class="val">${raw.length}</div></div>
          <div class="stat"><div class="lbl" style="color:#6ee7b7">صالحة</div><div class="val" style="color:#34d399">${validItems.length}</div></div>
          <div class="stat"><div class="lbl" style="color:#fca5a5">أخطاء</div><div class="val" style="color:#f87171">${errors.length}</div></div>
        </div>`;

      const tbl = document.getElementById('preview-table');
      tbl.innerHTML = `
        <table><thead><tr><th>#</th><th>السؤال</th><th>المادة</th><th>الإجابة</th></tr></thead><tbody>
          ${validItems.slice(0,50).map((it,i)=>`<tr>
            <td>${i+1}</td><td>${esc(it.question.slice(0,60))}</td>
            <td>${esc(it.subject)}</td><td><span class="badge badge-green">${it.correct}</span></td>
          </tr>`).join('')}
          ${errors.map(err=>`<tr style="background:rgba(239,68,68,.08)">
            <td>${err.idx}</td><td colspan="3" style="color:#fca5a5">خطأ: ${esc(err.reason)}</td>
          </tr>`).join('')}
        </tbody></table>`;

      document.getElementById('preview-area').style.display='block';
    }catch(err){
      showAlert('import-alert','خطأ في التحقق: '+(err.message||err),'error');
    }
  });

  document.getElementById('btn-cancel').addEventListener('click', ()=>{
    document.getElementById('preview-area').style.display='none';
    document.getElementById('file').value='';
    validItems = [];
  });

  document.getElementById('btn-confirm').addEventListener('click', async (ev)=>{
    const btn = ev.currentTarget;
    if(!validItems.length) return;
    const status = document.getElementById('import-status').value;
    btn.disabled = true; btn.innerHTML='<span class="loader"></span> جاري الاستيراد...';
    try{
      const { data, error } = await sb.rpc('import_questions', {
        p_items: validItems, p_status: status
      });
      if(error) throw error;

      document.getElementById('result-area').style.display='block';
      document.getElementById('result-area').innerHTML = `
        <div class="alert alert-success show">
          ✓ تم استيراد <strong>${data.inserted}</strong> سؤال بنجاح.
          ${data.skipped > 0 ? `تم تخطي ${data.skipped}.` : ''}
        </div>`;
      document.getElementById('preview-area').style.display='none';
      document.getElementById('file').value='';
      validItems = [];
      toast('تم الاستيراد ✓','success');
    }catch(err){
      showAlert('import-alert','فشل الاستيراد: '+(err.message||err),'error');
      btn.disabled = false; btn.textContent = '✓ تأكيد الاستيراد';
    }
  });
}

async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if(session?.user){
    state.user = session.user;
    await loadProfile();
  }
  sb.auth.onAuthStateChange(async (event, session)=>{
    if(session?.user){
      state.user = session.user;
      await loadProfile();
    } else {
      state.user = null; state.profile = null;
    }
    if(['SIGNED_IN','SIGNED_OUT','TOKEN_REFRESHED'].includes(event)) route();
  });
  route();
}

boot();
